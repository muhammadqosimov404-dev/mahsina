<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5269e8"><title>MAHSINA — Messenger</title>
<style>
:root{--b:#5269e8;--bg:#f3f5fb;--txt:#18213b;--mut:#77809b;--line:#e7eaf4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,Arial,sans-serif;color:var(--txt)}button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;min-height:100vh;display:grid;grid-template-columns:310px 1fr;background:#fff}.side{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:17px}.brand{display:flex;gap:10px;align-items:center;font-size:22px;font-weight:850}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#5269e8,#9870f6);color:white;display:grid;place-items:center}.tag{font-size:10px;letter-spacing:2px;color:var(--mut)}.search{padding:12px;background:var(--bg);border-radius:13px;display:flex;gap:8px}.search input{width:100%;border:0;background:transparent;outline:0}.label{font-size:11px;color:var(--mut);letter-spacing:1.2px;font-weight:800}.chats{display:flex;flex-direction:column;gap:5px}.chat{display:flex;align-items:center;gap:11px;text-align:left;padding:10px;border-radius:14px;background:white;color:inherit}.chat.active,.chat:hover{background:#eef1ff}.av{width:46px;height:46px;flex-shrink:0;border-radius:16px;background:linear-gradient(135deg,#8192ff,#5269e8);color:white;display:grid;place-items:center;font-weight:800}.green{background:linear-gradient(135deg,#31c8a0,#148a9e)}.orange{background:linear-gradient(135deg,#ffb46b,#f06b82)}.purple{background:linear-gradient(135deg,#bf83ff,#7554d9)}.ci{min-width:0;flex:1}.cn{font-size:13px;font-weight:750;display:flex;justify-content:space-between;gap:5px}.time{font-size:10px;color:var(--mut);white-space:nowrap}.prev{font-size:12px;color:var(--mut);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile{margin-top:auto;background:#f1f3ff;border-radius:15px;padding:12px;display:flex;align-items:center;gap:10px;font-size:12px}.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}.top{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.person{display:flex;align-items:center;gap:11px}.person h2{font-size:15px;margin:0 0 4px}.status{font-size:11px;color:#1eb980}.icons{display:flex;gap:6px}.ib{width:38px;height:38px;border-radius:12px;background:var(--bg);color:#64708f}.notice{margin:15px 20px 0;padding:12px 14px;border-radius:13px;background:linear-gradient(100deg,#edf0ff,#f7f4ff);font-size:12px;color:#65719a;line-height:1.6}.messages{padding:20px;display:flex;flex-direction:column;gap:14px;flex:1;background:radial-gradient(ellipse at top right,#f8f7ff,transparent 55%)}.day{text-align:center;color:#9ba3ba;font-size:10px;letter-spacing:1px}.mr{display:flex;gap:8px;align-items:flex-end;max-width:84%}.mr.mine{align-self:flex-end;flex-direction:row-reverse}.mini{width:27px;height:27px;border-radius:9px;background:#e3e7ff;color:var(--b);display:grid;place-items:center;font-size:10px;font-weight:800;flex-shrink:0}.bubble{padding:10px 13px;border-radius:15px 15px 15px 5px;background:white;border:1px solid var(--line);font-size:13px;line-height:1.55;overflow-wrap:anywhere}.mine .bubble{background:linear-gradient(135deg,var(--b),#7969ed);color:white;border:0;border-radius:15px 15px 5px 15px}.meta{text-align:right;color:#9ca4ba;font-size:9px;margin-top:4px}.mine .meta{color:#dce1ff}.compose{border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:8px;align-items:center}.compose input{flex:1;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);outline:0}.send{width:46px;height:46px;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--b),#7969ed);font-size:18px}.foot{text-align:center;font-size:10px;color:#9ba3b8;padding:0 10px 10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17213d;color:white;padding:11px 15px;border-radius:12px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:700px){.app{display:block;min-height:100dvh}.side{min-height:100dvh;border:0;padding:17px 12px}.main{display:none;min-height:100dvh}.app.open .side{display:none}.app.open .main{display:flex}.top{padding:12px}.notice{margin:10px 12px 0}.messages{padding:14px 12px}.compose{padding:10px}.mr{max-width:92%}.back{display:inline-block!important}}.back{display:none}
</style></head><body>
<div class="app" id="app"><aside class="side"><div class="brand"><div class="logo">MJ</div><div>MAHSINA<div class="tag">MESSENGER</div></div></div><label class="search">⌕ <input id="search" placeholder="Chatlarni qidirish..."></label><div class="label">XABARLAR · DEMO</div><div class="chats" id="chats"></div><div class="profile"><div class="av purple">MJ</div><div><b>Mening profilim</b><div style="color:#77809b;margin-top:4px">MAHSINA’da xush kelibsiz</div></div><button class="ib" id="profile">⚙</button></div></aside>
<main class="main"><header class="top"><div class="person"><button class="ib back" id="back">‹</button><div class="av" id="headAv">SA</div><div><h2 id="headName">Sardor</h2><div class="status" id="status">● demo suhbat</div></div></div><div class="icons"><button class="ib" id="call">☎</button><button class="ib" id="more">•••</button></div></header><div class="notice">✨ <b>MAHSINA demo versiyasi.</b> Xabarlar faqat shu brauzerda saqlanadi. Haqiqiy onlayn chat uchun server kerak.</div><section class="messages" id="messages"></section><form class="compose" id="form"><button type="button" class="ib" id="emoji">☺</button><input id="input" maxlength="1000" placeholder="Xabar yozing..." autocomplete="off"><button class="send" aria-label="Yuborish">➤</button></form><div class="foot">MAHSINA • Muha Production konsepti • Hozircha demo</div></main></div><div class="toast" id="toast"></div>
<script>
const starter=[{id:'sardor',name:'Sardor',initial:'SA',color:'',status:'demo suhbat',preview:'Salom! Qalaysan?',time:'20:24',msgs:[['them','Salom! MAHSINA qanday ishlayapti?','20:24'],['me','Yaxshi! Hozir demo versiyasini sinayapman 😊','20:25'],['them','Zo‘r! Yangi funksiyalarni kutaman.','20:26']]},{id:'news',name:'MAHSINA yangiliklari',initial:'MJ',color:'purple',status:'kanal • demo',preview:'Ilovamizga xush kelibsiz!',time:'Kecha',msgs:[['them','MAHSINA messenjerining demo versiyasiga xush kelibsiz! 💜','Kecha'],['them','Bu namuna kanal. Haqiqiy kanallar server ulangandan keyin ishlaydi.','Kecha']]},{id:'jasmina',name:'Jasmina',initial:'JA',color:'orange',status:'demo suhbat',preview:'🌸 Yaxshi kun!',time:'Kecha',msgs:[['them','Salom! 🌸','Kecha'],['them','Yaxshi kun tilayman!','Kecha']]},{id:'group',name:'Do‘stlar guruhi',initial:'DG',color:'green',status:'guruh • demo',preview:'Aziz: hammaga salom!',time:'Du',msgs:[['them','Aziz: Hammaga salom! 👋','Du'],['them','Malika: Dam olish kuni ko‘rishamizmi?','Du']]},{id:'saved',name:'Saqlangan xabarlar',initial:'★',color:'purple',status:'faqat siz uchun',preview:'Muhim xabarlaringiz',time:'',msgs:[['them','Eslab qolmoqchi bo‘lgan xabarlaringizni shu yerda saqlang.','Bugun']]}];
let chats=starter.map(c=>({...c,msgs:c.msgs.map(m=>({from:m[0],text:m[1],time:m[2]}))})),current='sardor';const $=x=>document.getElementById(x);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function active(){return chats.find(c=>c.id===current)}
function renderChats(){let q=$('search').value.toLowerCase();$('chats').innerHTML=chats.filter(c=>c.name.toLowerCase().includes(q)||c.preview.toLowerCase().includes(q)).map(c=>`<button class="chat ${c.id===current?'active':''}" data-id="${c.id}"><div class="av ${c.color}">${esc(c.initial)}</div><div class="ci"><div class="cn">${esc(c.name)}<span class="time">${esc(c.time)}</span></div><div class="prev">${esc(c.preview)}</div></div></button>`).join('');document.querySelectorAll('.chat').forEach(b=>b.onclick=()=>select(b.dataset.id))}
function select(id){current=id;let c=active();$('headName').textContent=c.name;$('headAv').textContent=c.initial;$('headAv').className='av '+c.color;$('status').textContent='● '+c.status;renderChats();renderMsgs();$('app').classList.add('open')}
function renderMsgs(){let c=active();$('messages').innerHTML='<div class="day">BUGUN • DEMO</div>'+c.msgs.map(m=>`<div class="mr ${m.from==='me'?'mine':''}">${m.from!=='me'?`<div class="mini">${esc(c.initial)}</div>`:''}<div class="bubble">${esc(m.text)}<div class="meta">${esc(m.time)} ${m.from==='me'?'✓✓':''}</div></div></div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}
function save(){try{localStorage.setItem('mahsina-demo-v1',JSON.stringify(chats))}catch(e){}}try{let v=JSON.parse(localStorage.getItem('mahsina-demo-v1'));if(Array.isArray(v)&&v.length)chats=v}catch(e){}
$('search').oninput=renderChats;$('form').onsubmit=e=>{e.preventDefault();let t=$('input').value.trim();if(!t)return;let c=active(),tm=new Date().toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});c.msgs.push({from:'me',text:t,time:tm});c.preview=t;c.time=tm;$('input').value='';save();renderChats();renderMsgs()};$('emoji').onclick=()=>{$('input').value+='😊';$('input').focus()};$('back').onclick=()=>$('app').classList.remove('open');$('profile').onclick=()=>toast('Profil sozlamalari keyingi bosqichda qo‘shiladi.');$('call').onclick=()=>toast('Qo‘ng‘iroq uchun server va WebRTC kerak.');$('more').onclick=()=>toast('Bu demo: server va haqiqiy akkauntlar hali ulanmagan.');renderChats();select(current);
</script></body></html>
