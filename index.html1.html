<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717">
<title>MAHSINA Messenger</title>
<link rel="icon" type="image/png" id="favicon">
<style>
:root{--bg:#eef2f7;--panel:#fff;--text:#182230;--muted:#738095;--line:#e1e7ef;--primary:#b99350;--bubble:#edf2f8;--field:#f7f9fc}
body.dark{--bg:#101720;--panel:#19232f;--text:#eef4fc;--muted:#a4b0c0;--line:#303c4b;--primary:#c8a766;--bubble:#283544;--field:#202d3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.app{display:flex;max-width:1250px;height:100dvh;margin:auto;background:var(--panel);overflow:hidden}
.sidebar{width:330px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.topbar{padding:14px 16px;background:#171717;color:#f4e5c2;border-bottom:1px solid #9c793d}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:bold;letter-spacing:2px}
.brand img{width:44px;height:44px;border-radius:11px;border:1px solid #b99350}.brand span{flex:1}
.icon-btn{background:transparent;color:inherit;font-size:20px;padding:6px 10px;border-radius:9px}
.profile-row{display:flex;gap:10px;align-items:center;margin-top:12px;cursor:pointer}
.profile-row small,.person small{display:block;color:var(--muted);font-size:12px}.topbar small{color:#cdb98a}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;flex:none}
.search{padding:12px}.field,.search input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--field);color:var(--text);outline:none}
.tabs{display:flex;gap:4px;padding:0 8px 10px}.tab{flex:1;padding:10px 4px;border-radius:9px;background:transparent;color:var(--muted);font-size:12px}.tab.active{background:var(--bubble);color:var(--text);font-weight:bold}
.list{overflow-y:auto;flex:1}.person{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.person:hover,.person.active{background:var(--bubble)}
.person-main{flex:1;min-width:0}.person-main strong,.person-main small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:24px;text-align:center;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;padding:12px}
.vstory{aspect-ratio:9/15;border-radius:14px;overflow:hidden;border:2px solid var(--primary);cursor:pointer;background:#222}.vstory video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.main{display:flex;flex:1;min-width:0;flex-direction:column}
.welcome{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:20px}
.welcome img{width:128px;height:128px;border-radius:28px;box-shadow:0 10px 35px #0003}.welcome h2{color:var(--text);margin:10px 0 0}
.chat-screen{display:none;flex:1;min-height:0;flex-direction:column}.chat-screen.on{display:flex}
.chat-head{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.chat-head .icon-btn{display:none;color:var(--text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:4px}.dot.on{background:#2fb344}
.messages{flex:1;min-height:0;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:72%;padding:10px 13px;border-radius:16px;background:var(--bubble);align-self:flex-start;word-wrap:break-word}
.msg.mine{align-self:flex-end;background:var(--primary);color:#fff}
.msg .n{font-size:11px;font-weight:bold;color:var(--primary);margin-bottom:3px}
.quote{font-size:12px;opacity:.8;border-left:3px solid currentColor;padding-left:7px;margin-bottom:6px}
.meta{font-size:10px;opacity:.65;text-align:right;margin-top:3px}.gone{font-style:italic;opacity:.7}
.tools{display:flex;gap:10px;margin-top:4px}.tools button{background:none;color:inherit;opacity:.75;font-size:11px;padding:0}
.composer{padding:11px;border-top:1px solid var(--line)}
.replying{display:none;justify-content:space-between;gap:8px;margin-bottom:8px;padding:9px;border-radius:8px;background:var(--bubble);font-size:13px}
.replying button{background:none;color:var(--text)}
.emoji-row{display:flex;gap:4px;margin-bottom:6px}.emoji-row button{background:none;font-size:20px}
.compose-row{display:flex;gap:8px}.compose-row button,.btn{background:var(--primary);color:#fff;border-radius:11px;padding:10px 16px;font-weight:bold}
.btn.sec{background:var(--bubble);color:var(--text)}.btn.red{background:#c92a4a}
.backdrop{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:14px;background:#0008}
.modal{width:100%;max-width:420px;max-height:90dvh;overflow:auto;background:var(--panel);border-radius:16px;padding:18px}
.modal h2{margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.stack{display:grid;gap:10px}label{font-size:13px;color:var(--muted)}textarea.field{min-height:80px}
.card{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--field);display:grid;gap:6px;overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw input{width:20px;height:20px}.note{background:var(--bubble);padding:10px;border-radius:10px;font-size:13px}.muted{color:var(--muted)}.small{font-size:12px}
.menu-item{display:block;width:100%;text-align:left;padding:14px;background:transparent;color:var(--text);border-bottom:1px solid var(--line)}.menu-item:hover{background:var(--bubble)}
.viewer{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:999}.viewer.open{display:flex}
.viewer video{max-width:100%;max-height:100%}.vclose{position:absolute;top:14px;right:20px;color:#fff;font-size:36px;cursor:pointer;z-index:2;line-height:1}
.vnav{position:absolute;top:50%;color:#fff;font-size:34px;cursor:pointer;padding:12px;z-index:2;user-select:none}.vprev{left:6px}.vnext{right:6px}
#auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.authbox{width:100%;max-width:380px;background:var(--panel);border-radius:16px;padding:22px;display:grid;gap:12px;text-align:center}
.authbox img{width:84px;height:84px;border-radius:20px;margin:auto}.authbox h1{margin:0;font-size:22px}.authbox .field{text-align:left}
@media(min-width:800px){body{padding:18px}.app{height:calc(100dvh - 36px);border:1px solid var(--line);border-radius:18px}}
@media(max-width:700px){.sidebar{width:100%;border-right:0}.main{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.chat-head .icon-btn{display:block}.msg{max-width:86%}}
</style>
</head>
<body>
<div class="app" id="app">
 <aside class="sidebar">
  <header class="topbar">
   <div class="brand"><img data-logo alt="MAHSINA"><span>MAHSINA</span><button class="icon-btn" id="themeBtn" aria-label="Mavzu">🌙</button></div>
   <div class="profile-row" id="profileBtn"><div class="avatar" id="myAvatar">?</div><div><strong id="myName">Mening profilim</strong><small>Profilni tahrirlash</small></div></div>
  </header>
  <div class="search"><input id="search" placeholder="🔎 Qidirish..." autocomplete="off"></div>
  <nav class="tabs" id="tabs"><button class="tab active" data-tab="chats">💬 Chatlar</button><button class="tab" data-tab="contacts">👥 Odamlar</button><button class="tab" data-tab="stories">🎬 Story</button><button class="tab" data-tab="menu">☰ Menyu</button></nav>
  <div class="list" id="list"></div>
 </aside>
 <main class="main">
  <div class="welcome" id="welcome"><img data-logo alt=""><h2>MAHSINA Messenger</h2><p>Suhbatni tanlang yoki "Odamlar" bo'limidan yangi suhbat boshlang.</p></div>
  <section class="chat-screen" id="chatScreen">
   <header class="chat-head"><button class="icon-btn" id="backBtn" aria-label="Orqaga">←</button><div class="avatar" id="chatAvatar"></div><div><strong id="chatName"></strong><small class="muted" id="chatSub"></small></div></header>
   <div class="messages" id="messages"></div>
   <div class="composer">
    <div class="replying" id="replying"><span id="replyText"></span><button id="cancelReply">✕</button></div>
    <div class="emoji-row"><button type="button">😀</button><button type="button">😂</button><button type="button">❤️</button><button type="button">👍</button><button type="button">🔥</button></div>
    <form class="compose-row" id="sendForm" autocomplete="off"><input class="field" id="messageInput" placeholder="Xabar yozing..." maxlength="500" required><button id="send" aria-label="Yuborish">➤</button></form>
   </div>
  </section>
 </main>
</div>
<div class="viewer" id="viewer"><span class="vclose" id="vclose">&times;</span><span class="vnav vprev" id="vprev">&#10094;</span><video id="player" controls playsinline></video><span class="vnav vnext" id="vnext">&#10095;</span></div>
<div class="backdrop" id="backdrop"><section class="modal"><h2><span id="mTitle"></span><button class="icon-btn" id="mClose" style="color:var(--text)">✕</button></h2><div id="mBody"></div></section></div>
<div id="auth"><form id="authForm" class="authbox">
 <img data-logo alt="MAHSINA"><h1 id="authTitle">Kirish</h1>
 <div class="hidden" id="nameF"><input class="field" id="aName" maxlength="20" placeholder="Ism" autocomplete="nickname"></div>
 <input class="field" id="aEmail" type="email" required placeholder="Email" autocomplete="email">
 <input class="field" id="aPass" type="password" required minlength="6" placeholder="Parol (kamida 6 belgi)" autocomplete="current-password">
 <p id="authErr" class="small" style="color:#c92a4a;margin:0"></p>
 <button class="btn" id="authBtn">Kirish</button>
 <button type="button" class="btn sec" id="authSwitch">Yangi hisob ochish</button>
</form></div>

import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, doc, setDoc, getDoc, updateDoc, where, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyCdweCGAm6DlqWDCHPD7ocXiQMhz_dc7p4",authDomain:"mahsina-messenger.firebaseapp.com",projectId:"mahsina-messenger",storageBucket:"mahsina-messenger.firebasestorage.app",messagingSenderId:"716366197323",appId:"1:716366197323:web:2602461b3f47ae62b913ce"});
const db=getFirestore(app),auth=getAuth(app),$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const get=(k,d)=>{try{const x=localStorage.getItem("mahsina_"+k);return x===null?d:JSON.parse(x)}catch{return d}};
const put=(k,v)=>{try{localStorage.setItem("mahsina_"+k,JSON.stringify(v))}catch{}};
const errTxt=e=>esc(e.code||e.message);
const COLORS=["#b99350","#3b5bdb","#2f9e6e","#c2410c","#7c6cf0","#0e7490"];
const hue=s=>COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const ini=s=>(s||"?").slice(0,2).toUpperCase();

/* STORY VIDEOLAR: yangi video qo'shish uchun fayl nomini shu ro'yxatga yozing */
const STORY_VIDEOS=["story1.mp4","story2.mp4"];

let name="",uid=null,tab="chats",cur=null,unsub=null,replyText="",dmChats=[],people=null,timer=0;

/* ---------- Mavzu ---------- */
function theme(){const d=get("theme","light")==="dark";document.body.classList.toggle("dark",d);$("themeBtn").textContent=d?"☀️":"🌙"}
$("themeBtn").onclick=()=>{put("theme",get("theme","light")==="dark"?"light":"dark");theme()};theme();

/* ---------- Ism ---------- */
function setName(n){name=n;$("myName").textContent=n||"Mening profilim";$("myAvatar").textContent=ini(n);
 if(uid&&n)setDoc(doc(db,"users",uid),{name:n,nameLower:n.toLowerCase()},{merge:true}).catch(console.error)}

/* ---------- Ro'yxat ---------- */
function row(id,n,sub,act,extra=""){return `<div class="person${cur&&cur.key===id?" active":""}" data-act="${act}" data-id="${esc(id)}" data-n="${esc(n)}"><div class="avatar" style="background:${hue(id)}">${esc(ini(n))}</div><div class="person-main"><strong>${esc(n)}</strong><small>${esc(sub)}</small></div>${extra}</div>`}
function renderList(){
 const q=$("search").value.trim().toLowerCase(),L=$("list");
 $("search").placeholder=tab==="contacts"?"🔎 Ism bo'yicha odam qidirish...":"🔎 Qidirish...";
 if(tab==="chats"){
  const items=[{id:"global",n:"Umumiy chat",sub:"Hamma uchun ochiq chat"},...dmChats.map(c=>({id:c.other,n:c.n,sub:"Shaxsiy chat"}))].filter(x=>x.n.toLowerCase().includes(q));
  L.innerHTML=items.map(x=>row(x.id,x.n,x.sub,"open")).join("")||'<div class="empty">Chat topilmadi.</div>';
 }else if(tab==="contacts"){
  L.innerHTML=people===null?'<div class="empty">Qidirish uchun ism yozing.</div>':people.length?people.map(p=>row(p.id,p.n,"Chat boshlash","open")).join(""):'<div class="empty">Hech kim topilmadi.</div>';
 }else if(tab==="stories"){
  L.innerHTML=STORY_VIDEOS.length?'<div class="vgrid">'+STORY_VIDEOS.map((s,i)=>`<div class="vstory" data-act="story" data-i="${i}"><video src="${esc(s)}" muted playsinline preload="metadata"></video></div>`).join("")+"</div>":'<div class="empty">Hozircha video yo\'q.</div>';
 }else{
  L.innerHTML=[["profile","👤 Profil"],["privacy","🔒 Maxfiylik"],["months","📅 Hisob muddati"],["premium","⭐ Premium"],["helper","🤖 Yordamchi bot"],["logout","🚪 Hisobdan chiqish"]].map(m=>`<button class="menu-item" data-act="menu" data-id="${m[0]}">${m[1]}</button>`).join("");
 }
}
function setTab(t){tab=t;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));$("search").value="";if(t==="chats")loadDms();renderList()}
$("tabs").onclick=e=>{if(e.target.dataset.tab)setTab(e.target.dataset.tab)};
$("search").oninput=()=>{if(tab!=="contacts")return renderList();clearTimeout(timer);timer=setTimeout(findPeople,350)};
async function findPeople(){
 const q=$("search").value.trim().toLowerCase();if(!q){people=null;return renderList()}
 try{const s=await getDocs(query(collection(db,"users"),where("nameLower",">=",q),where("nameLower","<=",q+"\uf8ff"),limit(15)));
  people=s.docs.filter(d=>d.id!==uid).map(d=>({id:d.id,n:d.data().name||"Foydalanuvchi"}))}catch(e){console.error(e);people=[]}
 renderList();
}
async function loadDms(){
 if(!uid)return;
 try{const s=await getDocs(query(collection(db,"dms"),where("members","array-contains",uid)));
  dmChats=s.docs.map(d=>{const x=d.data(),o=x.members.find(m=>m!==uid);return{other:o,n:(x.names||{})[o]||"Foydalanuvchi"}});renderList()}catch(e){console.error(e)}
}
$("list").onclick=e=>{
 const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
 if(a==="open")openChat(t.dataset.id,t.dataset.n);
 else if(a==="story")playStory(+t.dataset.i);
 else if(a==="menu")menu(t.dataset.id);
};

/* ---------- Chat ---------- */
const chatCol=()=>cur.key==="global"?collection(db,"messages"):collection(db,"dms",cur.dmId,"messages");
function openChat(key,n){
 cancelReply();
 cur=key==="global"?{key,name:"Umumiy chat"}:{key,name:n,dmId:[uid,key].sort().join("_")};
 $("welcome").style.display="none";$("chatScreen").classList.add("on");$("app").classList.add("chat-open");
 $("chatName").textContent=cur.name;$("chatAvatar").textContent=key==="global"?"UC":ini(n);$("chatAvatar").style.background=hue(key);
 $("chatSub").innerHTML='<span class="dot" id="dot"></span><span id="status">ulanmoqda...</span>';
 $("messages").innerHTML='<div class="empty">Yuklanmoqda...</div>';
 if(unsub)unsub();
 unsub=onSnapshot(query(chatCol(),orderBy("createdAt","asc"),limit(200)),snap=>{
  $("dot").className="dot on";$("status").textContent="onlayn";drawMsgs(snap.docs.map(d=>({id:d.id,...d.data()})))
 },err=>{console.error(err);$("dot").className="dot";$("status").textContent="xato: "+(err.code||"ulanib bo'lmadi")});
 renderList();
}
function drawMsgs(arr){
 const box=$("messages");box.replaceChildren();
 if(!arr.length){box.innerHTML='<div class="empty">Hali xabar yo\'q. Birinchi xabarni yuboring! 👋</div>';return}
 arr.forEach(m=>{
  const mine=m.uid?m.uid===uid:m.sender===name,b=document.createElement("article");b.className="msg"+(mine?" mine":"");
  let h="";
  if(m.replyText)h+=`<div class="quote">↪ ${esc(m.replyText)}</div>`;
  if(!mine)h+=`<div class="n">${esc(m.sender||"Mehmon")}</div>`;
  h+=m.deleted?'<div class="gone">🚫 Bu xabar o\'chirildi</div>':`<div>${esc(m.text||"")}</div>`;
  const tm=m.createdAt&&m.createdAt.toDate?m.createdAt.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";
  h+=`<div class="meta">${tm}</div>`;
  if(!m.deleted)h+=`<div class="tools"><button data-r="${esc(m.id)}">↩ Javob</button><button data-c="${esc(m.id)}">Nusxa</button>${mine?`<button data-d="${esc(m.id)}">🗑 O'chirish</button>`:""}</div>`;
  b.innerHTML=h;b._m=m;box.append(b);
 });
 box.scrollTop=box.scrollHeight;
}
$("messages").onclick=async e=>{
 const b=e.target.closest("button"),art=e.target.closest(".msg");if(!b||!art)return;const m=art._m;
 if(b.dataset.r){replyText=(m.text||"").slice(0,100);$("replyText").textContent="Javob: "+replyText;$("replying").style.display="flex";$("messageInput").focus()}
 else if(b.dataset.c){try{await navigator.clipboard.writeText(m.text||"");b.textContent="✓ Nusxalandi"}catch{}}
 else if(b.dataset.d){if(!confirm("Ushbu xabarni o'chirasizmi?"))return;
  try{await updateDoc(doc(chatCol(),m.id),{deleted:true,text:""})}catch(err){console.error(err);alert("O'chirib bo'lmadi: "+(err.code||err.message))}}
};
function cancelReply(){replyText="";$("replying").style.display="none";$("replyText").textContent=""}
$("cancelReply").onclick=cancelReply;
$("backBtn").onclick=()=>$("app").classList.remove("chat-open");
document.querySelectorAll(".emoji-row button").forEach(b=>b.onclick=()=>{const i=$("messageInput");i.value+=(i.value?" ":"")+b.textContent;i.focus()});
$("sendForm").addEventListener("submit",async e=>{
 e.preventDefault();const text=$("messageInput").value.trim();if(!text||!cur)return;$("send").disabled=true;
 try{
  if(cur.key!=="global"){await setDoc(doc(db,"dms",cur.dmId),{members:[uid,cur.key],names:{[uid]:name,[cur.key]:cur.name}},{merge:true});
   if(!dmChats.some(c=>c.other===cur.key)){dmChats.push({other:cur.key,n:cur.name});renderList()}}
  const data={text,sender:name,uid,createdAt:serverTimestamp()};if(replyText)data.replyText=replyText;
  await addDoc(chatCol(),data);$("messageInput").value="";cancelReply();
 }catch(err){console.error(err);alert("Xabar yuborilmadi: "+(err.code||err.message))}
 $("send").disabled=false;$("messageInput").focus();
});

/* ---------- Video story ---------- */
let sc=0;
function playStory(i){sc=(i+STORY_VIDEOS.length)%STORY_VIDEOS.length;const p=$("player");p.src=STORY_VIDEOS[sc];$("viewer").classList.add("open");p.play().catch(()=>{})}
$("vclose").onclick=()=>{$("player").pause();$("viewer").classList.remove("open")};
$("vprev").onclick=()=>playStory(sc-1);$("vnext").onclick=()=>playStory(sc+1);
$("player").onended=()=>{if(sc<STORY_VIDEOS.length-1)playStory(sc+1)};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("vclose").click();closeModal()}});

/* ---------- Menyu oynalari ---------- */
function modal(t,html,mount){$("mTitle").textContent=t;$("mBody").innerHTML=html;$("backdrop").style.display="flex";mount&&mount($("mBody"))}
function closeModal(){$("backdrop").style.display="none"}
$("mClose").onclick=closeModal;$("backdrop").onclick=e=>{if(e.target===$("backdrop"))closeModal()};
$("profileBtn").onclick=()=>menu("profile");
function menu(id){
 if(id==="logout")return signOut(auth);
 if(id==="profile")modal("Profil",`<form class="stack" id="pf"><div><label>Ism (chatda shu ism ko'rinadi)</label><input class="field" id="pn" maxlength="20" value="${esc(name)}"></div><div><label>Bio</label><textarea class="field" id="pb" maxlength="160" placeholder="O'zingiz haqingizda">${esc(get("profile",{bio:""}).bio||"")}</textarea></div><button class="btn">Saqlash</button><p class="small muted" id="pm"></p></form>`,m=>{
  m.querySelector("#pf").onsubmit=e=>{e.preventDefault();const n=m.querySelector("#pn").value.trim();if(!n){m.querySelector("#pm").textContent="Ism bo'sh bo'lmasin.";return}
   put("profile",{bio:m.querySelector("#pb").value});setName(n);m.querySelector("#pm").textContent="Saqlandi."}});
 if(id==="privacy"){const p=get("privacy",{online:false,last:false});modal("Maxfiylik",`<p class="muted small">Sozlamalar shu brauzerda saqlanadi.</p><label class="sw"><span><b>Onlayn holatni yashirish</b></span><input type="checkbox" id="po" ${p.online?"checked":""}></label><label class="sw"><span><b>Oxirgi kirishni yashirish</b></span><input type="checkbox" id="pl" ${p.last?"checked":""}></label><p class="note" style="margin-top:12px">Hozircha bu sozlamalar chatga ta'sir qilmaydi, faqat saqlanadi.</p>`,m=>{
  const s=()=>put("privacy",{online:m.querySelector("#po").checked,last:m.querySelector("#pl").checked});m.querySelector("#po").onchange=s;m.querySelector("#pl").onchange=s})}
 if(id==="months")modal("Hisob muddati",`<div class="stack"><p class="muted small">Standart muddat: 24 oy. Haqiqiy o'chirish hali ishlamaydi.</p><label>Faolsizlik muddati (oy)</label><select class="field" id="mo">${[6,7,12,16,24].map(v=>`<option${v===get("months",24)?" selected":""}>${v}</option>`).join("")}</select><button class="btn" id="ms">Saqlash</button><p class="small muted" id="mm"></p></div>`,m=>{
  m.querySelector("#ms").onclick=()=>{put("months",+m.querySelector("#mo").value);m.querySelector("#mm").textContent="Saqlandi: "+m.querySelector("#mo").value+" oy."}});
 if(id==="premium")modal("Premium",`<p class="muted small">Premium admin tasdig'isiz yoqilmaydi.</p><div class="cards">${[["1 oy",10000],["3 oy",15000],["6 oy",20000],["12 oy",25000]].map(p=>`<div class="card"><b>${p[0]}</b><span>${p[1].toLocaleString("uz-UZ")} so'm</span><button class="btn buy" data-t="${p[0]}" data-p="${p[1]}">Tanlash</button></div>`).join("")}</div><p class="note hidden" id="pmsg" style="margin-top:10px"></p><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><button class="btn sec" id="tp">Sinov Premiumni yoqish/o'chirish</button><p class="muted small" id="ps"></p>`,m=>{
  const ps=()=>m.querySelector("#ps").textContent=(get("premium",false)?"Sinov Premium yoqilgan. ":"")+"Haqiqiy obuna emas. To'lov hali ulanmagan.";ps();
  m.querySelector("#tp").onclick=()=>{put("premium",!get("premium",false));ps()};
  m.querySelectorAll(".buy").forEach(b=>b.onclick=()=>{const r=get("requests",[]);r.unshift({term:b.dataset.t,price:b.dataset.p,at:Date.now()});put("requests",r);
   const x=m.querySelector("#pmsg");x.textContent=b.dataset.t+" tanlandi. To'lov hali ulanmagan, admin tasdig'i kerak.";x.classList.remove("hidden")})});
 if(id==="helper")modal("Yordamchi bot",`<form class="stack" id="af"><label>Murojaat turi</label><select class="field" id="at"><option>Spam haqida xabar</option><option>Cheklov ustidan shikoyat</option><option>Hisobga kirish muammosi</option><option>Boshqa</option></select><label>Izoh</label><textarea class="field" id="ax" maxlength="500" required placeholder="Muammoni tushuntiring..."></textarea><button class="btn">Murojaat yuborish</button></form><h3 style="margin:16px 0 8px">Murojaatlar tarixi</h3><div class="stack" id="al"></div>`,m=>{
  const draw=()=>{const a=get("appeals",[]);m.querySelector("#al").innerHTML=a.length?a.map(x=>`<div class="card"><b>${esc(x.type)}</b><span>${esc(x.text)}</span><span class="small muted">${new Date(x.at).toLocaleString("uz-UZ")}</span></div>`).join(""):'<p class="muted small">Murojaat yo\'q.</p>'};draw();
  m.querySelector("#af").onsubmit=e=>{e.preventDefault();const a=get("appeals",[]);a.unshift({type:m.querySelector("#at").value,text:m.querySelector("#ax").value.trim(),at:Date.now()});put("appeals",a);m.querySelector("#ax").value="";draw()}});
}

/* ---------- Kirish ---------- */
let reg=false;
function authMode(r){reg=r;$("authTitle").textContent=r?"Yangi hisob":"Kirish";$("authBtn").textContent=r?"Ro'yxatdan o'tish":"Kirish";$("authSwitch").textContent=r?"Hisobim bor":"Yangi hisob ochish";$("nameF").classList.toggle("hidden",!r);$("aPass").autocomplete=r?"new-password":"current-password";$("authErr").textContent=""}
$("authSwitch").onclick=()=>authMode(!reg);
$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();$("authErr").textContent="";const email=$("aEmail").value.trim(),pass=$("aPass").value;
 try{
  if(reg){const n=$("aName").value.trim();if(!n){$("authErr").textContent="Ismingizni yozing.";return}localStorage.setItem("mahsina_pendingName",n);await createUserWithEmailAndPassword(auth,email,pass)}
  else await signInWithEmailAndPassword(auth,email,pass);
 }catch(err){console.error(err);
  const m={"auth/invalid-credential":"Email yoki parol noto'g'ri.","auth/email-already-in-use":"Bu email band.","auth/weak-password":"Parol juda oddiy (kamida 6 belgi).","auth/invalid-email":"Email noto'g'ri.","auth/too-many-requests":"Juda ko'p urinish. Birozdan keyin qayta urining."};
  $("authErr").textContent=m[err.code]||("Xato: "+(err.code||err.message))}
});
onAuthStateChanged(auth,async user=>{
 if(user){
  uid=user.uid;$("auth").classList.add("hidden");let n="";
  try{const s=await getDoc(doc(db,"users",uid));if(s.exists())n=s.data().name||""}catch(err){console.error(err)}
  if(!n)n=localStorage.getItem("mahsina_pendingName")||(user.email||"Mehmon").split("@")[0].slice(0,20);
  localStorage.removeItem("mahsina_pendingName");setName(n);setTab("chats");
 }else{
  uid=null;cur=null;if(unsub){unsub();unsub=null}dmChats=[];people=null;
  $("chatScreen").classList.remove("on");$("welcome").style.display="";$("app").classList.remove("chat-open");
  $("auth").classList.remove("hidden");$("aPass").value="";authMode(false);
 }
});
</script>
</body>
</html>
