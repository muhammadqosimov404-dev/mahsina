<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAHSINA — Messenger</title>
<style>
:root{--bg:#e8eefc;--card:#fff;--blue:#3b5bdb;--blue2:#5c7cfa;--text:#1b1f3b;--muted:#6b7394;--mine:#3b5bdb;--line:#d9e1f7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center}
.app{display:flex;width:100%;max-width:1100px;height:100vh;background:var(--card)}
.side{width:320px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#f6f8ff}
.logo{display:flex;align-items:center;gap:10px;padding:18px}
.badge{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.logo b{font-size:20px;letter-spacing:.5px;display:block}
.logo small{font-size:10px;letter-spacing:3px;color:var(--muted);font-weight:700}
.search{margin:0 16px 12px;padding:12px 14px;border-radius:12px;border:0;background:#e3e9ff;font-size:14px;outline:none}
.label{font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:700;padding:6px 18px}
.chats{flex:1;overflow:auto;padding:0 8px}
.chat{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;cursor:pointer}
.chat.active{background:#cfdbff}
.av{width:44px;height:44px;border-radius:12px;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.chat b{font-size:14px;display:block}.chat span{font-size:12px;color:var(--muted)}
.me{margin:10px;padding:12px;border-radius:14px;background:#e3e9ff;display:flex;gap:12px;align-items:center;cursor:pointer}
.me b{font-size:14px;display:block}.me span{font-size:12px;color:var(--muted)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.head b{display:block}.head small{color:var(--muted);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:4px}
.dot.on{background:#2fb344}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:#f2f5ff}
.notice{background:#dfe7ff;color:var(--blue);padding:10px 14px;border-radius:12px;font-size:13px}
.m{max-width:70%;padding:10px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);align-self:flex-start;word-wrap:break-word}
.m.mine{align-self:flex-end;background:var(--mine);color:#fff;border:0}
.m .n{font-size:11px;font-weight:700;color:var(--blue);margin-bottom:2px}
.m .t{font-size:10px;opacity:.65;margin-top:4px;text-align:right}
.bar{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.bar input{flex:1;padding:13px 16px;border-radius:14px;border:0;background:#e3e9ff;font-size:15px;outline:none}
.bar button{width:48px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:18px;cursor:pointer}
.bar button:disabled{opacity:.5}
.foot{text-align:center;font-size:10px;color:var(--muted);padding-bottom:8px}
@media(max-width:720px){.side{display:none}.app{height:100dvh}.m{max-width:85%}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="badge">MJ</div><div><b>MAHSINA</b><small>MESSENGER</small></div></div>
    <input class="search" placeholder="Chatlarni qidirish...">
    <div class="label">XABARLAR</div>
    <div class="chats">
      <div class="chat active"><div class="av" style="background:#3b5bdb">UC</div><div><b>Umumiy chat</b><span>Hamma shu yerda yozadi</span></div></div>
    </div>
    <div class="me" id="me" title="Ismni o'zgartirish"><div class="av" id="meAv" style="background:#7c6cf0">?</div><div><b id="meName">Mening profilim</b><span>Ismni o'zgartirish uchun bosing</span></div></div>
  </aside>
  <section class="main">
    <div class="head"><div class="av" style="background:#3b5bdb">UC</div><div><b>Umumiy chat</b><small><span class="dot" id="dot"></span><span id="status">ulanmoqda...</span></small></div></div>
    <div class="msgs" id="msgs"><div class="notice">MAHSINA onlayn chat. Xabarlar hamma uchun umumiy va Firebase'da saqlanadi.</div></div>
    <form class="bar" id="form" autocomplete="off">
      <input id="inp" placeholder="Xabar yozing..." maxlength="500">
      <button id="send" type="submit" aria-label="Yuborish">&#10148;</button>
    </form>
    <div class="foot">MAHSINA &bull; Muha Production</div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCdweCGAm6DlqWDCHPD7ocXiQMhz_dc7p4",
  authDomain: "mahsina-messenger.firebaseapp.com",
  projectId: "mahsina-messenger",
  storageBucket: "mahsina-messenger.firebasestorage.app",
  messagingSenderId: "716366197323",
  appId: "1:716366197323:web:2602461b3f47ae62b913ce"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let name = localStorage.getItem("mahsina_name");
function askName(force){
  let n = (force || !name) ? prompt("Ismingizni kiriting:", name || "") : name;
  n = (n || "").trim().slice(0, 20);
  if (!n) n = name || "Mehmon" + Math.floor(Math.random() * 900 + 100);
  name = n;
  localStorage.setItem("mahsina_name", name);
  document.getElementById("meName").textContent = name;
  document.getElementById("meAv").textContent = name.slice(0, 2).toUpperCase();
}
askName(false);
document.getElementById("me").onclick = () => { askName(true); render(); };

const msgsEl = document.getElementById("msgs");
const dot = document.getElementById("dot");
const statusEl = document.getElementById("status");
let docs = [];

function render(){
  msgsEl.querySelectorAll(".m").forEach(e => e.remove());
  docs.forEach(d => {
    const mine = d.sender === name;
    const el = document.createElement("div");
    el.className = "m" + (mine ? " mine" : "");
    if (!mine) { const n = document.createElement("div"); n.className = "n"; n.textContent = d.sender || "Mehmon"; el.appendChild(n); }
    const tx = document.createElement("div"); tx.textContent = d.text; el.appendChild(tx);
    const t = document.createElement("div"); t.className = "t";
    if (d.createdAt && d.createdAt.toDate) t.textContent = d.createdAt.toDate().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    el.appendChild(t);
    msgsEl.appendChild(el);
  });
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

const q = query(collection(db, "messages"), orderBy("createdAt", "asc"), limit(200));
onSnapshot(q, snap => {
  docs = snap.docs.map(d => d.data());
  dot.className = "dot on"; statusEl.textContent = "onlayn";
  render();
}, err => {
  console.error(err);
  dot.className = "dot"; statusEl.textContent = "xato: " + (err.code || "ulanib bo'lmadi");
});

const form = document.getElementById("form");
const inp = document.getElementById("inp");
const send = document.getElementById("send");
form.addEventListener("submit", async e => {
  e.preventDefault();
  const text = inp.value.trim();
  if (!text) return;
  send.disabled = true;
  try {
    await addDoc(collection(db, "messages"), { text, sender: name, createdAt: serverTimestamp() });
    inp.value = "";
  } catch (err) {
    console.error(err);
    alert("Xabar yuborilmadi: " + (err.code || err.message));
  }
  send.disabled = false;
  inp.focus();
});
</script>
</body>
</html>
